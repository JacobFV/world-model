[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmodel-substrate"
version = "0.3.0"
description = "Versioned evidence datasets and a temporal world graph"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2"]
fast = ["numpy>=1.26"]
# Grounded cognitive agents (worldmodel.agents). tensacode is the claim-store/appraisal/choose
# substrate and has no third-party dependencies of its own. It is not on PyPI yet; install the
# local checkout with `pip install -e <tensacode>/tensacode/python`, or point this at a
# published release once there is one. The core imports and the full suite runs without it.
agents = ["tensacode>=0.0.0.dev0"]

[project.scripts]
wm = "worldmodel.cli:main"

[tool.setuptools.packages.find]
include = ["worldmodel*"]

[tool.setuptools.package-data]
# Non-Python package data shipped in wheels and sdists (estimation declarations, reference backbone).
worldmodel = [
    "estimation/requirements.json",
    "reference/*.json",
    "reference/*.csv",
    "reference/*.md",
    "reference/**/*.json",
    "reference/**/*.csv",
    "**/*.json",
    "**/*.csv",
    "**/*.txt",
]

[tool.setuptools.exclude-package-data]
worldmodel = ["**/__pycache__/*", "**/*.pyc"]
