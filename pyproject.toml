[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmodel-substrate"
version = "0.2.0"
description = "Versioned evidence datasets and a temporal world graph"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2"]

[project.scripts]
wm = "worldmodel.cli:main"

[tool.setuptools.packages.find]
include = ["worldmodel*"]
